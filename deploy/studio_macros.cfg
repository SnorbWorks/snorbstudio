# Ender Studio macros (included from printer.cfg).  The slicer profile calls
# PRINT_START / PRINT_END; the UI's filament buttons call LOAD/UNLOAD.

# Per-filament first-layer squish lives here (SAVE_VARIABLE squish_<key>),
# saved from the Print page's live Z adjust.
[save_variables]
filename: ~/printer_data/config/variables.cfg

# What the running print's filament is and how much squish PRINT_START
# applied, so the Print page can tell its live adjust apart from it.
[gcode_macro _STUDIO_FILAMENT]
variable_material: ""
variable_squish: 0.0
gcode:
  RESPOND MSG="filament {printer['gcode_macro _STUDIO_FILAMENT'].material} squish {printer['gcode_macro _STUDIO_FILAMENT'].squish}"

[gcode_macro PRINT_START]
description: Heat up, home, load the bed mesh and draw a purge line
gcode:
  {% set BED = params.BED|default(60)|float %}
  {% set HOTEND = params.HOTEND|default(205)|float %}
  {% set MAT = params.MATERIAL|default("")|lower %}
  {% set SQUISH = params.SQUISH|default(0)|float %}
  {% set saved = printer.save_variables.variables %}
  {% if MAT and ("squish_" ~ MAT) in saved %}
    {% set SQUISH = saved["squish_" ~ MAT]|float %}
  {% endif %}
  {% if MAT == "pla" or not MAT %}
    {% set SQUISH = 0.0 %}            # PLA is the reference (probe Z offset)
  {% endif %}
  {% set SQUISH = [[SQUISH, -0.3]|max, 0.3]|min %}
  SET_GCODE_VARIABLE MACRO=_STUDIO_FILAMENT VARIABLE=material VALUE='"{MAT}"'
  SET_GCODE_VARIABLE MACRO=_STUDIO_FILAMENT VARIABLE=squish VALUE={SQUISH}
  M140 S{BED}
  M104 S150                       # warm, but not hot enough to ooze
  G90
  G28
  BED_MESH_PROFILE LOAD=default
  SET_GCODE_OFFSET Z={SQUISH}         # filament squish (+ = nozzle higher)
  G1 Z10 F600
  G1 X5 Y20 F6000
  M190 S{BED}
  M109 S{HOTEND}
  # Purge: three lines up the left edge of the bed, then wipe the tip on
  # the bed so the ooze and the purge string stay there instead of being
  # carried to the print (PETG strings and blobs otherwise).
  M83
  G1 Z0.3 F600
  G1 X5 Y200 E14 F1500
  G1 X5.6 Y200 F1500
  G1 X5.6 Y20 E14 F1500
  G1 X6.2 Y20 F1500
  G1 X6.2 Y120 E8 F1200           # slower third line: pressure settles
  G1 E-1 F1800
  G1 X6.2 Y160 F4000              # wipe along the clean bed
  G1 X9 Y150 F4000                # and step sideways to snap the string
  G1 Z2 F600

[gcode_macro PRINT_END]
description: Retract, lift, present the print and switch everything off
gcode:
  {% set maxz = printer.toolhead.axis_maximum.z %}
  {% set z = printer.toolhead.position.z %}
  M83
  G1 E-3 F1800
  G91
  G1 Z{ [10, maxz - z - 1]|min } F600
  G90
  G1 X10 Y220 F6000
  TURN_OFF_HEATERS
  M107
  M84
  _STUDIO_RESET_SQUISH

[gcode_macro _STUDIO_RESET_SQUISH]
description: Drop the filament squish so jogging and the next print start clean
gcode:
  SET_GCODE_OFFSET Z=0
  SET_GCODE_VARIABLE MACRO=_STUDIO_FILAMENT VARIABLE=material VALUE='""'
  SET_GCODE_VARIABLE MACRO=_STUDIO_FILAMENT VARIABLE=squish VALUE=0

[gcode_macro LOAD_FILAMENT]
description: Heat and feed new filament through the Bowden tube to the nozzle
gcode:
  {% set TEMP = params.TEMP|default(210)|float %}
  {% if printer.extruder.temperature < TEMP - 5 %}
    M109 S{TEMP}
  {% else %}
    M104 S{TEMP}
  {% endif %}
  M83
  {% for i in range(6) %}
    G1 E50 F1500                  # fast through the tube (300 mm)
  {% endfor %}
  {% for i in range(3) %}
    G1 E30 F240                   # slowly into the hot end
  {% endfor %}
  M400
  RESPOND MSG="Filament loaded - extrude more if it isn't flowing yet"

[gcode_macro UNLOAD_FILAMENT]
description: Heat and pull the filament all the way out of the Bowden tube
gcode:
  {% set TEMP = params.TEMP|default(210)|float %}
  {% if printer.extruder.temperature < TEMP - 5 %}
    M109 S{TEMP}
  {% else %}
    M104 S{TEMP}
  {% endif %}
  M83
  G1 E10 F300                     # soften and shape the tip first
  G1 E-15 F3000                   # snap back out of the melt zone
  {% for i in range(9) %}
    G1 E-50 F2000
  {% endfor %}
  M400
  RESPOND MSG="Filament unloaded - pull it out of the extruder"

[gcode_macro M600]
description: Filament change: pause and park so the filament can be swapped
gcode:
  PAUSE
  RESPOND TYPE=error MSG="Filament change: Unload, load the new colour, then press Resume"

# Mainsail's CANCEL_PRINT runs user_cancel_macro, so a cancelled print also
# drops its filament squish.
[gcode_macro _CLIENT_VARIABLE]
variable_user_cancel_macro: "_STUDIO_RESET_SQUISH"
gcode:
