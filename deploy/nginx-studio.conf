# Ender Studio: the main page on port 80.  Mainsail moves to port 8080.
server {
    # IPv4 only: Moonraker trusts the home IPv4 range, and browsers fall back
    # to IPv4 when .local also resolves to an IPv6 address.
    listen 80 default_server;
    access_log /var/log/nginx/studio-access.log;
    error_log /var/log/nginx/studio-error.log;
    gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 4;
    gzip_types text/plain text/css text/javascript application/javascript application/json model/stl application/octet-stream application/wasm;
    client_max_body_size 0;
    root /home/admin/studio/web;
    index index.html;
    server_name _;
    location / { try_files $uri $uri/ /index.html; }
    location ~ \.(html|js|css)$ { add_header Cache-Control "no-cache"; }
    location /studio-api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 600;
    }
    location /websocket {
        proxy_pass http://apiserver/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://apiserver$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 600;
    }
}
