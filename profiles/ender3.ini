# Ender 3 (V4.2.2 board, Klipper, CR Touch) base profile for PrusaSlicer.
# The UI layers quality / material / support choices on top of this
# (see QUALITY, MATERIAL, job_config in server/studio_server.py).

# --- machine
printer_technology = FFF
gcode_flavor = klipper
bed_shape = 0x0,235x0,235x235,0x235
max_print_height = 245
nozzle_diameter = 0.4
z_offset = 0
use_relative_e_distances = 1
use_firmware_retraction = 0
gcode_label_objects = firmware
gcode_comments = 0
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 1000
machine_max_acceleration_retracting = 1000
machine_max_acceleration_travel = 1500
machine_max_acceleration_x = 1500
machine_max_acceleration_y = 1500
machine_max_acceleration_z = 100
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
machine_max_feedrate_z = 5
machine_max_jerk_x = 8
machine_max_jerk_y = 8
thumbnails =
# PRINT_START does all the heating (bed first, nozzle after homing), homes,
# loads the bed mesh and draws a purge line.  The layer count feeds the
# "Layer x / y" display.
autoemit_temperature_commands = 0
start_gcode = SET_PRINT_STATS_INFO TOTAL_LAYER=[total_layer_count]\nPRINT_START BED=[first_layer_bed_temperature] HOTEND=[first_layer_temperature]
end_gcode = PRINT_END
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]
layer_gcode = SET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}
template_custom_gcode =

# --- filament (material presets override temperatures/fan/retraction)
filament_diameter = 1.75
filament_density = 1.24
filament_cost = 20
extrusion_multiplier = 1
cooling = 1
fan_always_on = 1
bridge_fan_speed = 100
slowdown_below_layer_time = 8
min_print_speed = 15
retract_length = 5
retract_speed = 40
deretract_speed = 40
retract_lift = 0.2
retract_lift_below = 240
retract_before_travel = 2
retract_layer_change = 1
wipe = 0

# --- print
extrusion_width = 0.45
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
support_material_extrusion_width = 0.4
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
infill_every_layers = 1
seam_position = aligned
ensure_vertical_shell_thickness = 1
thin_walls = 0
avoid_crossing_perimeters = 0
# Speeds (mm/s) suit a stock Ender 3 with a Bowden extruder.
perimeter_speed = 45
external_perimeter_speed = 30
small_perimeter_speed = 25
infill_speed = 60
solid_infill_speed = 50
top_solid_infill_speed = 35
gap_fill_speed = 30
bridge_speed = 30
support_material_speed = 50
support_material_interface_speed = 40
travel_speed = 150
first_layer_speed = 20
first_layer_speed_over_raft = 20
max_volumetric_speed = 10
# Accelerations are sent to Klipper (SET_VELOCITY_LIMIT) as the print runs.
default_acceleration = 1000
perimeter_acceleration = 800
external_perimeter_acceleration = 700
infill_acceleration = 1200
bridge_acceleration = 700
first_layer_acceleration = 500
travel_acceleration = 1500
skirt_distance = 4
skirt_height = 1
min_skirt_length = 10
brim_separation = 0.1
brim_type = outer_only
# Supports: on/off and style come from the UI; these are the details.
support_material_contact_distance = 0.2
support_material_interface_layers = 2
support_material_spacing = 2.5
support_material_pattern = rectilinear
support_material_xy_spacing = 60%
support_material_synchronize_layers = 0
dont_support_bridges = 1
raft_layers = 0
interface_shells = 0
complete_objects = 0
output_filename_format = {input_filename_base}.gcode
